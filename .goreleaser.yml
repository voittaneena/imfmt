# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: imfmt

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/imfmt
    binary: imfmt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/voittaneena/imfmt/internal/version.Version={{ .Tag }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  use: github
  format: '{{ .SHA }}: {{ .Message }}{{ if .Logins }} ({{ .Logins | englishJoin }}){{ end }}'
  filters:
    exclude:
      - '^test:'
      - "^test\\("
      - "^chore\\(deps\\):"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: '🚀 Features'
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 100
    - title: '🐛 Bug fixes'
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 200
    - title: '📗 Documentation'
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 300
    - title: '🧹 Updates'
      regexp: '^.*?(refactor|chore)(\(.+\))??!?:.+$'
      order: 400
    - title: '📦 Other'
      order: 9999

release:
  prerelease: auto
  footer: |
    **Full Changelog**: https://github.com/voittaneena/imfmt/compare/{{ .PreviousTag }}...{{ .Tag }}
